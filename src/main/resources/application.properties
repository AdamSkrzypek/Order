spring.application.name=order-service
server.port=8081

# PostgreSQL properties #

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Kafka topics #

topics.order.request=order-request
topics.order.response=order-response
topics.order.expired = order-expired
topics.payment=payment-status
topics.inventory=inventory-status

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-service-group

kafka.publish.timeout-seconds=5

# Eureka client — defaults below are for local mvnw dev; docker-compose overrides
# each of these via the matching env var per container instance.

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8080/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${EUREKA_INSTANCE_NONSECUREPORT:8081}
eureka.instance.instance-id=${spring.application.name}:${EUREKA_INSTANCE_ID:${eureka.instance.non-secure-port}}

# Variables#
payment.timeout.expiration = 30
